[project]
name = "jarvis-compass"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "anthropic",
    "postgrest",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
